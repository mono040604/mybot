[project]
name = "monobot"
version = "0.1.0"
description = "A lightweight ai agent framework - build form scratch"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "typer>=0.12",
    "prompt-toolkit>=3.0",
    "loguru>=0.7",
    "jinjia2>=3.1",
]

[project.scripts]
monobot = "monobot.cli.commands:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]